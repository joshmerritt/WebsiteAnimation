# Cloudflare Worker: the analytics API behind the DaDataDad dashboards.
# Reads PostHog (HogQL), returns aggregated JSON. See analytics-worker.js.
#
# Deployed URL (must match VITE_ANALYTICS_API_URL in .env.production and the
# connect-src entry in public/.htaccess):
#   https://site-analytics.dadatadad-analytics.workers.dev
#
# Deploy:
#   cd analytics-worker
#   npx wrangler login                         # once per machine
#   npx wrangler secret put POSTHOG_API_KEY    # personal API key, scope: query:read
#   npx wrangler deploy
#
# The personal API key MUST stay a secret — it can read all project data. It is
# never sent to the browser; the browser only ever receives aggregated JSON.
#
# This replaced a worker named `ga4-analytics-api`, which read the Google
# Analytics Data API. That one is a separate worker and is not touched by a
# deploy here. Once this is live, remove it and its Google credentials with:
#   npx wrangler delete --name ga4-analytics-api

name = "site-analytics"
main = "analytics-worker.js"
compatibility_date = "2026-09-12"

# Keep request logs so a failed dashboard load can be explained afterwards
# (`npx wrangler tail`, or Workers → site-analytics → Logs).
[observability]
enabled = true

[vars]
POSTHOG_PROJECT_ID = "605146"
POSTHOG_HOST       = "https://us.posthog.com"
# Only events sent from this hostname are counted (keeps localhost and preview
# traffic out — the same rule as the project's test-account filter).
SITE_HOST          = "dadatadad.com"
# Events before this instant are ignored. Release 3.2.1 (deployed 2026-09-13
# ~16:10 UTC) stopped the intro demo logging a fake score + project open on
# every page load; everything before 2026-09-11 is test traffic.
DATA_EPOCH_UTC     = "2026-09-13 16:15:00"
ALLOWED_ORIGINS    = "https://dadatadad.com,https://www.dadatadad.com,http://localhost:4173,http://localhost:5173"
